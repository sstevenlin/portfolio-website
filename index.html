<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Steven Lin | Interactive Portfolio</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome for icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <!-- GAME UI -->
  <div class="game-container">
    <!-- GAME HUD -->
    <div class="game-hud">
      <div class="hud-left">
        <div class="player-info">
          <div class="player-name">Steven Lin</div>
          <div class="player-title">CS & Math Student @ Cornell</div>
        </div>
      </div>
      <div class="hud-center">
        <div class="instructions">
          Use <span class="key">WASD</span> or <span class="key">Arrow Keys</span> to move<br>
          Press <span class="key">SPACE</span> near furniture to interact<br>
          <span class="click-hint">Click furniture to walk there automatically</span>
        </div>
      </div>
      <div class="hud-right">
        <div class="social-links">
          <a href="https://github.com/sstevenlin" target="_blank" title="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://linkedin.com/in/steven-lin-" target="_blank" title="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="https://instagram.com/sstevenlin" target="_blank" title="Instagram">
            <i class="fab fa-instagram"></i>
          </a>
          <a href="mailto:sl3484@cornell.edu" title="Email">
            <i class="fas fa-envelope"></i>
          </a>
        </div>
      </div>
    </div>

    <!-- GAME WORLD -->
    <div class="game-world">
      <div class="pokemon-room">
        <!-- Room Floor -->
        <div class="room-floor" style="grid-column: 1/21; grid-row: 1/16;"></div>
        
        <!-- Room Walls -->
        <div class="room-wall wall-top" style="grid-column: 1/21; grid-row: 1/2;"></div>
        <div class="room-wall wall-bottom" style="grid-column: 1/21; grid-row: 15/16;"></div>
        <div class="room-wall wall-left" style="grid-column: 1/2; grid-row: 1/16;"></div>
        <div class="room-wall wall-right" style="grid-column: 20/21; grid-row: 1/16;"></div>
        
        <!-- Furniture -->
        <!-- Bed -->
        <div class="furniture bed" style="grid-column: 2/6; grid-row: 3/7;">
          <div class="furniture-sprite"></div>
          <div class="furniture-label">Bed</div>
          <div class="bed-sheets"></div>
          <div class="pillow-1"></div>
          <div class="pillow-2"></div>
          <div class="headboard"></div>
          <div class="bed-leg-1"></div>
          <div class="bed-leg-2"></div>
          <div class="bed-leg-3"></div>
        </div>
        
        <!-- Desk/Table -->
        <div class="furniture desk" style="grid-column: 15/19; grid-row: 3/6;">
          <div class="furniture-sprite"></div>
          <div class="furniture-label">Desk</div>
          <div class="desk-lamp">
            <div class="lamp-shade"></div>
          </div>
          <div class="monitor">
            <div class="monitor-screen"></div>
            <div class="monitor-stand"></div>
          </div>
          <div class="chair">
            <div class="chair-back"></div>
          </div>
          <div class="drawer-handle-1"></div>
          <div class="drawer-handle-2"></div>
        </div>
        
        <!-- Closet -->
        <div class="furniture closet" style="grid-column: 2/5; grid-row: 10/14;">
          <div class="furniture-sprite"></div>
          <div class="furniture-label">Closet</div>
          <div class="closet-door-left">
            <div class="door-handle-left"></div>
          </div>
          <div class="closet-door-right">
            <div class="door-handle-right"></div>
          </div>
          <div class="shelf-1"></div>
          <div class="shelf-2"></div>
          <div class="shelf-3"></div>
          <div class="clothes-hanger"></div>
          <div class="shirt"></div>
          <div class="pants"></div>
        </div>
        
        <!-- Music Player -->
        <div class="furniture music-player" style="grid-column: 16/19; grid-row: 10/13;">
          <div class="furniture-sprite"></div>
          <div class="furniture-label">Music</div>
          <div class="cd-tray">
            <div class="cd-disc">
              <div class="cd-center"></div>
            </div>
          </div>
          <div class="volume-knob"></div>
          <div class="play-button">
            <div class="play-triangle"></div>
          </div>
          <div class="speaker-left">
            <div class="speaker-hole"></div>
          </div>
          <div class="speaker-right">
            <div class="speaker-hole"></div>
          </div>
          <div class="led-display">
            <div class="led-text">CD</div>
          </div>
        </div>
        
        <!-- Character -->
        <div class="character" id="character" style="grid-column: 10; grid-row: 7;">
          <div class="character-sprite">
            <div class="head">
              <div class="ear-left">
                <div class="inner-ear-left"></div>
              </div>
              <div class="ear-right">
                <div class="inner-ear-right"></div>
              </div>
              <div class="eye-left"></div>
              <div class="eye-right"></div>
              <div class="nose"></div>
              <div class="mouth"></div>
              <div class="whisker-left-1"></div>
              <div class="whisker-left-2"></div>
              <div class="whisker-right-1"></div>
              <div class="whisker-right-2"></div>
            </div>
            <div class="body">
              <div class="belly"></div>
            </div>
            <div class="tail"></div>
            <div class="paw-left"></div>
            <div class="paw-right"></div>
          </div>
        </div>

        <!-- Interactive Zones (on furniture) -->
        <div class="interactive-zone bed-zone" data-zone="about" style="grid-column: 2/6; grid-row: 3/7;"></div>
        <div class="interactive-zone desk-zone" data-zone="experience" style="grid-column: 15/19; grid-row: 3/6;"></div>
        <div class="interactive-zone closet-zone" data-zone="skills" style="grid-column: 2/5; grid-row: 10/14;"></div>
        <div class="interactive-zone music-zone" data-zone="contact" style="grid-column: 16/19; grid-row: 10/13;"></div>

        <!-- Room Decorations -->
        <div class="room-decoration window" style="grid-column: 18/20; grid-row: 2/4;">🪟</div>
        <div class="room-decoration lamp" style="grid-column: 8/10; grid-row: 2/4;">💡</div>
        <div class="room-decoration plant" style="grid-column: 3/5; grid-row: 8/10;">🪴</div>
        <div class="room-decoration books" style="grid-column: 10/12; grid-row: 10/12;">📚</div>
        
        <!-- Door -->
        <div class="room-decoration door" style="grid-column: 1; grid-row: 7/9;">🚪</div>
        
        <!-- Dirty Clothes Piles -->
        <div class="clothes-pile pile-1" style="grid-column: 7/9; grid-row: 6/8;">
          <div class="clothes-item shirt-1"></div>
          <div class="clothes-item pants-1"></div>
          <div class="clothes-item sock-1"></div>
          <div class="clothes-item sock-2"></div>
        </div>
        
        <div class="clothes-pile pile-2" style="grid-column: 12/14; grid-row: 9/11;">
          <div class="clothes-item hoodie-1"></div>
          <div class="clothes-item jeans-1"></div>
          <div class="clothes-item underwear-1"></div>
        </div>
        
        <div class="clothes-pile pile-3" style="grid-column: 18/20; grid-row: 10/12;">
          <div class="clothes-item tshirt-1"></div>
          <div class="clothes-item shorts-1"></div>
          <div class="clothes-item sock-3"></div>
        </div>
        
        <div class="clothes-pile pile-4" style="grid-column: 3/5; grid-row: 7/9;">
          <div class="clothes-item sweater-1"></div>
          <div class="clothes-item sock-4"></div>
          <div class="clothes-item sock-5"></div>
        </div>
        
        <!-- Single scattered items -->
        <div class="clothes-item single-shirt" style="grid-column: 8; grid-row: 2;"></div>
        <div class="clothes-item single-pants" style="grid-column: 15; grid-row: 7;"></div>
        <div class="clothes-item single-sock" style="grid-column: 6; grid-row: 11;"></div>
        <div class="clothes-item single-hat" style="grid-column: 17; grid-row: 2;"></div>
      </div>
    </div>

    <!-- MODAL SYSTEM -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-content" id="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Modal Title</h2>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <div class="modal-body" id="modal-body">
          <!-- Content will be dynamically inserted here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Game Script -->
  <script src="./app.js"></script>
</body>
</html>
